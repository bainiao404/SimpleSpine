<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 拖拽预览示例 (PixiJS v7)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f1322;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 拖拽及信息遮罩层 */
        #drop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.85) 0%, rgba(15, 19, 34, 0.95) 100%);
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: all 0.3s ease;
            pointer-events: none; /* 让拖拽事件能够穿透到 window 监听 */
        }

        .drop-box {
            padding: 40px;
            border: 2px dashed #38bdf8;
            border-radius: 16px;
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 80%;
            transform: scale(1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 拖拽悬停时的激活状态 */
        body.dragover #drop-overlay {
            background: radial-gradient(circle at center, rgba(14, 165, 233, 0.2) 0%, rgba(15, 19, 34, 0.95) 100%);
        }

        body.dragover .drop-box {
            border-color: #00f2fe;
            transform: scale(1.05);
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 24px;
        }

        ul {
            text-align: left;
            margin: 20px auto;
            display: inline-block;
            padding-left: 20px;
            color: #94a3b8;
            line-height: 1.8;
        }

        .tip {
            font-size: 13px;
            color: #64748b;
            margin-top: 15px;
        }

        /* 左上角重置/重新加载按钮 */
        #reset-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(30, 41, 59, 0.7);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            font-weight: 500;
            transition: all 0.2s;
            display: none;
        }

        #reset-btn:hover {
            background: #38bdf8;
            color: #0f1322;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <button id="reset-btn" onclick="resetViewer()">重新上传</button>

    <div id="drop-overlay">
        <div class="drop-box">
            <h2>Spine 拖拽预览 (PixiJS v7)</h2>
            <p>请同时选中并拖入以下文件到浏览器窗口中：</p>
            <ul>
                <li>骨骼数据：<strong>.json</strong> 或 <strong>.skel</strong></li>
                <li>图集文件：<strong>.atlas</strong></li>
                <li>纹理图片：<strong>.png</strong></li>
            </ul>
            <p class="tip">提示：支持拖入多张 .png 纹理图片（若图集包含多个页面）</p>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- 引入 PixiJS v7 -->
    <script src="./pixi.min.js"></script>
    <!-- 引入 SimplePixiSpine -->
    <script src="../dist/simple-pixi-spine.js"></script>

    <script>
        let app;
        let spineCharacter = null;
        let objectURLs = [];

        // 初始化 PixiJS Application
        function initPixi() {
            const container = document.getElementById('canvas-container');
            // PixiJS v7 同步创建模式
            app = new PIXI.Application({
                width: container.clientWidth,
                height: container.clientHeight,
                backgroundColor: 0x0f1322,
                antialias: true,
                resizeTo: container
            });
            container.appendChild(app.view); // PixiJS v7 使用 app.view，v8 使用 app.canvas

            // 注册全局 PIXI 实例给 SimplePixiSpine
            SimplePixiSpine.registerPIXI(PIXI);
        }

        // 处理拖拽事件
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.body.classList.add('dragover');
        });

        window.addEventListener('dragleave', (e) => {
            e.preventDefault();
            if (e.relatedTarget === null) {
                document.body.classList.remove('dragover');
            }
        });

        window.addEventListener('drop', async (e) => {
            e.preventDefault();
            document.body.classList.remove('dragover');

            const files = Array.from(e.dataTransfer.files);
            const skeletonFile = files.find(f => f.name.endsWith('.json') || f.name.endsWith('.skel'));
            const atlasFile = files.find(f => f.name.endsWith('.atlas') || f.name.endsWith('.txt'));
            const imageFiles = files.filter(f => /\.(png|jpe?g|webp)$/i.test(f.name));

            if (!skeletonFile || !atlasFile) {
                alert('关键文件缺失！请同时拖入 .json/.skel 与 .atlas 文件。');
                return;
            }

            try {
                // 读取骨骼与图集文件内容
                const atlasData = await atlasFile.text();
                let skeletonData;
                if (skeletonFile.name.endsWith('.skel')) {
                    skeletonData = await skeletonFile.arrayBuffer();
                } else {
                    skeletonData = JSON.parse(await skeletonFile.text());
                }

                // 解析 atlas 文件中定义的图片文件名，用于智能匹配
                const pageNames = [];
                const atlasLines = atlasData.split(/\r?\n/);
                for (let i = 0; i < atlasLines.length; i++) {
                    const line = atlasLines[i].trim();
                    if (/\.(png|jpe?g|webp)$/i.test(line)) {
                        pageNames.push(line);
                    }
                }

                // 释放旧的 Blob 链接
                objectURLs.forEach(url => URL.revokeObjectURL(url));
                objectURLs = [];

                // 智能匹配拖入的图片与图集声明的图片名并使用 Blob URL 直传
                const textureData = [];
                const remainingImageFiles = [...imageFiles];

                // 第一阶段：精确名称匹配（不区分大小写）
                for (const pageName of pageNames) {
                    const matchIndex = remainingImageFiles.findIndex(
                        f => f.name.toLowerCase() === pageName.toLowerCase()
                    );
                    if (matchIndex !== -1) {
                        const file = remainingImageFiles.splice(matchIndex, 1)[0];
                        const url = URL.createObjectURL(file);
                        objectURLs.push(url);
                        textureData.push({ name: pageName, src: url });
                    }
                }

                // 第二阶段：如果只声明了一个页面且只拖入了一张图，直接关联；否则进行模糊/顺序兜底匹配
                if (pageNames.length === 1 && imageFiles.length === 1 && textureData.length === 0) {
                    const url = URL.createObjectURL(imageFiles[0]);
                    objectURLs.push(url);
                    textureData.push({ name: pageNames[0], src: url });
                } else {
                    for (const pageName of pageNames) {
                        if (textureData.some(t => t.name === pageName)) continue;
                        if (remainingImageFiles.length > 0) {
                            let matchIndex = remainingImageFiles.findIndex(f => {
                                const nameNoExt = f.name.replace(/\.[^/.]+$/, "");
                                const pageNoExt = pageName.replace(/\.[^/.]+$/, "");
                                return nameNoExt.includes(pageNoExt) || pageNoExt.includes(nameNoExt);
                            });
                            if (matchIndex === -1) matchIndex = 0;
                            const file = remainingImageFiles.splice(matchIndex, 1)[0];
                            const url = URL.createObjectURL(file);
                            objectURLs.push(url);
                            textureData.push({ name: pageName, src: url });
                        }
                    }
                }

                // 销毁旧的骨骼实例
                if (spineCharacter) {
                    app.stage.removeChild(spineCharacter);
                    spineCharacter.destroy({ children: true });
                    spineCharacter = null;
                }

                // 使用内存数据模式加载 Spine 资源
                const res = await SimplePixiSpine.load({
                    skeletonData,
                    atlasData,
                    textureData
                });

                // 创建 Spine 实例并添加至舞台
                const spineInstanceObj = SimplePixiSpine.spine(res);
                spineCharacter = spineInstanceObj.spine;

                // 居中定位
                spineCharacter.x = app.screen.width / 2;
                spineCharacter.y = app.screen.height * 0.85;

                // 自动按比例缩放以适应屏幕
                const bounds = spineCharacter.getLocalBounds();
                if (bounds.height > 0) {
                    const maxH = app.screen.height * 0.7;
                    const scale = maxH / bounds.height;
                    spineCharacter.scale.set(Math.min(scale, 1.5));
                } else {
                    spineCharacter.scale.set(0.5);
                }

                app.stage.addChild(spineCharacter);

                // 自动播放第一个可用的动画
                const animations = spineCharacter.state.data.skeletonData.animations;
                if (animations && animations.length > 0) {
                    spineCharacter.state.setAnimation(0, animations[0].name, true);
                }

                // 隐藏信息遮罩层，显示重置按钮
                document.getElementById('drop-overlay').style.display = 'none';
                document.getElementById('reset-btn').style.display = 'block';

            } catch (err) {
                console.error(err);
                alert('解析或加载 Spine 资源失败：' + err.message);
            }
        });

        // 重置视图，返回上传界面
        function resetViewer() {
            if (spineCharacter) {
                app.stage.removeChild(spineCharacter);
                spineCharacter.destroy({ children: true });
                spineCharacter = null;
            }
            objectURLs.forEach(url => URL.revokeObjectURL(url));
            objectURLs = [];

            document.getElementById('drop-overlay').style.display = 'flex';
            document.getElementById('reset-btn').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', initPixi);
    </script>
</body>
</html>
