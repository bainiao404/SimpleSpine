<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleSpine Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1322;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .controls-bar {
            background-color: #1e293b;
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            font-weight: 600;
            font-size: 16px;
            margin-right: 12px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #334155;
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #475569;
        }

        .btn.active {
            background-color: #00f2fe;
            color: #0b0f19;
            font-weight: 600;
        }

        .canvas-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: 500;
            color: #9ca3af;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        select:hover {
            border-color: #6366f1 !important;
        }
    </style>
</head>
<body>

    <div class="controls-bar">
        <span class="title">SimpleSpine Demo</span>
        <div style="margin-left: 15px; display: flex; align-items: center;">
            <label for="spine-version" style="color: #94a3b8; font-size: 14px; margin-right: 8px; font-weight: 500;">骨骼版本:</label>
            <select id="spine-version" onchange="changeSpineVersion(this.value)" style="background: #1e293b; color: #fff; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; outline: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: border-color 0.2s;">
                <option value="3.8-skel">Spine v3.8 Binary (.skel)</option>
                <option value="3.8-json">Spine v3.8 JSON (.json)</option>
                <option value="4.0-skel">Spine v4.0 Binary (.skel)</option>
                <option value="4.1-skel">Spine v4.1 Binary (.skel)</option>
                <option value="4.2-skel">Spine v4.2 Binary (.skel)</option>
            </select>
        </div>
        <div style="margin-left: 20px;" class="btn-group" id="animations">
            <button class="btn active" onclick="playAnim('idle')">Idle (空闲)</button>
            <button class="btn" onclick="playAnim('walk')">Walk (行走)</button>
            <button class="btn" onclick="playAnim('run')">Run (奔跑)</button>
            <button class="btn" onclick="playAnim('jump')">Jump (起跳)</button>
            <button class="btn" onclick="playAnim('shoot')">Shoot (射击)</button>
        </div>
        <div style="flex-grow: 1;"></div>
        <button class="btn" id="btn-debug" onclick="toggleDebug()">开启骨骼调试线</button>
    </div>

    <div class="canvas-container">
        <div id="loading">正在载入并解析骨骼资源...</div>
        <div id="canvas-container" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Load PixiJS v7 -->
    <script src="./pixi.min.js"></script>
    <!-- Load SimpleSpine Bundle -->
    <script src="../dist/simplespine.js"></script>

    <script>
        let app;
        let spineCharacter;
        let spineDebug;
        let debugEnabled = false;

        async function initDemo() {
            const container = document.getElementById('canvas-container');
            
            // 1. 初始化 PixiJS Application (v7 synchronous API)
            app = new PIXI.Application({
                width: container.clientWidth,
                height: container.clientHeight,
                backgroundColor: 0x0f1322,
                antialias: true,
                resizeTo: container
            });
            container.appendChild(app.view);

            // 必须显式向 SimpleSpine 注册全局 PIXI 实例
            SimpleSpine.registerPIXI(PIXI);

            // 2. 加载当前选中的骨骼版本
            await changeSpineVersion(document.getElementById('spine-version').value);
        }

        async function changeSpineVersion(value) {
            if (spineCharacter) {
                app.stage.removeChild(spineCharacter);
                spineCharacter.destroy({ children: true });
                spineCharacter = null;
            }
            if (spineDebug && debugEnabled) {
                toggleDebug();
            }
            spineDebug = null;

            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            loading.innerText = "正在载入并解析骨骼资源...";
            loading.style.color = "#9ca3af";

            let path;
            if (value === '3.8-skel') {
                path = 'assets/v3.8/spineboy-pro.skel';
            } else if (value === '3.8-json') {
                path = 'spineboy-pro.json';
            } else if (value === '4.0-skel') {
                path = 'assets/v4.0/spineboy-pro.skel';
            } else if (value === '4.1-skel') {
                path = 'assets/v4.1/spineboy-pro.skel';
            } else if (value === '4.2-skel') {
                path = 'assets/v4.2/spineboy-pro.skel';
            }

            try {
                const res = await SimpleSpine.load(path);
                console.log(`Spine ${value} Loaded Success:`, res);

                // 3. 创建 Spine 动画实例与骨骼调试渲染器
                const spineInstanceObj = SimpleSpine.spine(res);
                spineCharacter = spineInstanceObj.spine;
                spineDebug = spineInstanceObj.debug;

                // 4. 调整位置与缩放
                spineCharacter.x = app.screen.width / 2;
                spineCharacter.y = app.screen.height - 40;
                spineCharacter.scale.set(0.6);

                // 5. 将动画添加至舞台
                app.stage.addChild(spineCharacter);
                
                loading.style.display = 'none';

                if (debugEnabled) {
                    spineCharacter.debug = spineDebug;
                }

                // 6. 播放 Idle 动画
                playAnim('idle');

            } catch (err) {
                console.error(err);
                loading.innerText = "加载失败：" + err.message;
                loading.style.color = "#ef4444";
            }
        }

        // 播放特定动画逻辑
        // PixiJS v7 requires third param to loop correctly in loader wrappers
        function playAnim(name) {
            if (!spineCharacter) return;
            try {
                // 清理所有轨道并播放新动画
                spineCharacter.state.setAnimation(0, name, true);
                
                // 更新按钮高亮状态
                const btns = document.querySelectorAll('.btn-group .btn');
                btns.forEach(btn => {
                    const text = btn.innerText.toLowerCase();
                    if (text.includes(name)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            } catch (e) {
                console.error(e);
            }
        }

        // 开启/关闭骨骼调试绘制
        function toggleDebug() {
            if (!spineCharacter || !spineDebug) return;
            debugEnabled = !debugEnabled;
            
            const btn = document.getElementById('btn-debug');
            if (debugEnabled) {
                spineCharacter.debug = spineDebug;
                btn.classList.add('active');
                btn.innerText = "关闭骨骼调试线";
            } else {
                spineCharacter.debug = null;
                btn.classList.remove('active');
                btn.innerText = "开启骨骼调试线";
            }
        }

        // 初始化演示项目
        window.addEventListener('DOMContentLoaded', initDemo);
    </script>
</body>
</html>
