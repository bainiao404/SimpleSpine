<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleSpine Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1322;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .controls-bar {
            background-color: #1e293b;
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            font-weight: 600;
            font-size: 16px;
            margin-right: 12px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #334155;
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #475569;
        }

        .btn.active {
            background-color: #00f2fe;
            color: #0b0f19;
            font-weight: 600;
        }

        .canvas-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: 500;
            color: #9ca3af;
            pointer-events: none;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div class="controls-bar">
        <span class="title">SimpleSpine Demo (Spineboy 3.8 .skel)</span>
        <div class="btn-group" id="animations">
            <button class="btn active" onclick="playAnim('idle')">Idle (空闲)</button>
            <button class="btn" onclick="playAnim('walk')">Walk (行走)</button>
            <button class="btn" onclick="playAnim('run')">Run (奔跑)</button>
            <button class="btn" onclick="playAnim('jump')">Jump (起跳)</button>
            <button class="btn" onclick="playAnim('shoot')">Shoot (射击)</button>
        </div>
        <div style="flex-grow: 1;"></div>
        <button class="btn" id="btn-debug" onclick="toggleDebug()">开启骨骼调试线</button>
    </div>

    <div class="canvas-container">
        <div id="loading">正在载入并解析骨骼资源...</div>
        <div id="canvas-container" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Load PixiJS v8 -->
    <script src="./pixi.min.js"></script>
    <!-- Load SimpleSpine Bundle -->
    <script src="../dist/simplespine.js"></script>

    <script>
        let app;
        let spineCharacter;
        let spineDebug;
        let debugEnabled = false;

        async function initDemo() {
            const container = document.getElementById('canvas-container');
            
            // 1. 初始化 PixiJS Application (v8 asynchronous API)
            app = new PIXI.Application();
            await app.init({
                width: container.clientWidth,
                height: container.clientHeight,
                backgroundColor: 0x0f1322,
                antialias: true,
                resizeTo: container
            });
            container.appendChild(app.canvas);

            // 必须显式向 SimpleSpine 注册全局 PIXI 实例
            SimpleSpine.registerPIXI(PIXI);

            try {
                // 2. 加载 Spine v3.8 二进制 (.skel) 资源
                const res = await SimpleSpine.load('spineboy-pro.skel');
                console.log("Spine Loaded Success:", res);

                // 3. 创建 Spine 动画实例与骨骼调试渲染器
                const spineInstanceObj = SimpleSpine.spine(res);
                spineCharacter = spineInstanceObj.spine;
                spineDebug = spineInstanceObj.debug;

                // 4. 调整位置与缩放
                spineCharacter.x = app.screen.width / 2;
                spineCharacter.y = app.screen.height - 40;
                spineCharacter.scale.set(0.6);

                // 5. 将动画添加至舞台并默认播放 idle 状态
                app.stage.addChild(spineCharacter);
                
                // 解决正在载入的文字
                document.getElementById('loading').style.display = 'none';

                // 6. 播放 Idle 动画
                playAnim('idle');

            } catch (err) {
                console.error(err);
                const loading = document.getElementById('loading');
                loading.innerText = "加载失败：" + err.message;
                loading.style.color = "#ef4444";
            }
        }

        // 播放特定动画逻辑
        function playAnim(name) {
            if (!spineCharacter) return;
            try {
                // 清理所有轨道并播放新动画
                spineCharacter.state.setAnimation(0, name, true);
                
                // 更新按钮高亮状态
                const btns = document.querySelectorAll('.btn-group .btn');
                btns.forEach(btn => {
                    const text = btn.innerText.toLowerCase();
                    if (text.includes(name)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            } catch (e) {
                console.error(e);
            }
        }

        // 开启/关闭骨骼调试绘制
        function toggleDebug() {
            if (!spineCharacter || !spineDebug) return;
            debugEnabled = !debugEnabled;
            
            const btn = document.getElementById('btn-debug');
            if (debugEnabled) {
                spineCharacter.debug = spineDebug;
                btn.classList.add('active');
                btn.innerText = "关闭骨骼调试线";
            } else {
                spineCharacter.debug = null;
                btn.classList.remove('active');
                btn.innerText = "开启骨骼调试线";
            }
        }

        // 初始化演示项目
        window.addEventListener('DOMContentLoaded', initDemo);
    </script>
</body>
</html>
